; ===========================================================================
;  VModem 設定ファイル
;  Windows 用 本物のダイアルアップモデムエミュレータ
; ===========================================================================

[general]
; 我々 (VModem) が開く側の COM ポート。
; com0com で CNCA0 <-> CNCB0 のペアを作り、Windows のダイアルアップには
; CNCA0 を、VModem には CNCB0 を指定する。
; セットアップは scripts/setup-com0com.ps1 を参照。
com_port     = CNCB0

audio_enable = true
audio_volume = 0.7
; 部分一致で選ぶ。空なら既定の再生デバイス。
audio_device =

; 0=none 1=error 2=warn 3=info 4=debug 5=trace
log_level    = 3
log_file     = vmodem.log

; 合成したネゴシエーション音を WAV に書き出して検証したい時に true
dump_wav      = false
dump_wav_path = vmodem-dump.wav

; ===========================================================================
[timing]
; 各フェーズの長さ (ms)。0 を書くと既定値が使われる。
dialtone_ms   = 2000    ; 発信音 (日本: 400Hz 連続)
dtmf_on_ms    = 80      ; DTMF 1 桁の ON 時間  (ITU-T Q.24 最小 40ms)
dtmf_off_ms   = 80      ; DTMF 桁間の無音
ringback_count = 2      ; 呼出音を何回鳴らすか (1s ON / 2s OFF)

; true にするとハンドシェイク音を短縮する。動作確認用。
; 本物らしさを求めるなら false のままにする (V.34 は約 8 秒かかる)。
fast_connect  = false

; ===========================================================================
[ppp]
; PPP のアドレス割り当て。
;   server_ip = 我々 (モデム = 仮想 ISP 側)
;   client_ip = Windows RAS に割り当てるアドレス
; ★ client_ip は NAT 側の guest_ip として自動的に共有される ★
server_ip = 192.168.99.1
client_ip = 192.168.99.2
dns1      = 8.8.8.8
dns2      = 8.8.4.4

; true にすると PAP 認証を要求する。
; その場合、下の ISP セクションに username / password が必須。
require_auth = false

; ===========================================================================
[network]
; slirp    = libslirp によるユーザモード NAT (実インターネット接続)
; loopback = 内蔵の最小応答器 (ICMP/UDP Echo のみ。動作確認用)
; none     = PPP のみ (IP パケットは破棄)
mode = slirp

; ===========================================================================
;  仮想電話番号
; ===========================================================================
;  ここに書いた番号にダイアルした時だけ接続シーケンスが始まる。
;  一致しない番号は NO CARRIER を返す。
;
;  照合はハイフン・空白・括弧・ダイアル修飾子 (W , ; ! @ T P) を無視して
;  数字のみで行う。桁数・フォーマットは自由。
;
;  実在しない番号を推奨 (誤って本当に発信されることは無いが、
;  設定を人間が見た時に混乱しないため)。
;
;  protocol に指定できる値:
;    V21     300 bps
;    V22    1200 bps
;    V22BIS 2400 bps
;    V32    9600 bps
;    V32BIS 14400 bps
;    V34    28800 bps
;    V34PLUS 33600 bps  <- 推奨既定
;    V90    56000 bps
; ===========================================================================

[ISP_1]
number   = 0120-000-0000
speed    = 33600
protocol = V34PLUS

[ISP_2]
; 昔の「アクセスポイント電話番号」の雰囲気を出したい時に
number   = 0570-000-000
speed    = 28800
protocol = V34

[ISP_3]
; 短い番号でも良い (仕様: 桁数自由)
number   = 000
speed    = 14400
protocol = V32BIS

[ISP_4]
; 懐かしい 2400bps を聞きたい人向け
number   = 0000-00-00000
speed    = 2400
protocol = V22BIS

; 認証付きの例 (require_auth = true のとき有効になる)
;[ISP_5]
;number   = 0120-111-1111
;speed    = 33600
;protocol = V34PLUS
;username = guest
;password = guest
